name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace -PversionCode=$VERSION_CODE

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-comms-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to server (update check)
        if: ${{ vars.APK_SERVER_URL != '' }}
        env:
          APK_SERVER_URL: ${{ vars.APK_SERVER_URL }}
          APK_UPLOAD_SECRET: ${{ secrets.APK_UPLOAD_SECRET }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl -sf -X POST "$APK_SERVER_URL/apk/upload" \
            -H "X-Deploy-Secret: $APK_UPLOAD_SECRET" \
            -F "version_code=${{ github.run_number }}" \
            -F "version_name=0.1.${{ github.run_number }}" \
            -F "notes=$COMMIT_MESSAGE" \
            -F "apk=@android/app/build/outputs/apk/debug/app-debug.apk;type=application/vnd.android.package-archive"
