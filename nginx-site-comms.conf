server {
    listen 80;
    server_name ec2-16-170-108-223.eu-north-1.compute.amazonaws.com;

    # Allow larger uploads - task photos and APK builds are bigger than
    # nginx's tiny 1MB default.
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (manager console's live connection)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
