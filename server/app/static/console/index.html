<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babylon · Site Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#0b0f14;
    --panel:#121922;
    --panel-2:#0e141c;
    --border:#20303f;
    --grid-line:#1c2a38;
    --text:#e9eef3;
    --text-dim:#7d8ea1;
    --text-faint:#4d5c6c;
    --accent:#ff6a1f;
    --accent-dim:#a8481a;
    --accent-2:#ffc93c;
    --success:#3ecf7e;
    --danger:#ff4d5e;
    --app-color:#3ec6ff;
    --wa-color:#3ecf7e;
    --radius:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;}
  ::selection{background:var(--accent);color:#0b0f14;}

  #app{display:grid;grid-template-columns:296px 1fr;grid-template-rows:56px 1fr;height:100%;}

  /* ---------- Top bar ---------- */
  #topbar{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
  #brand{display:flex;align-items:center;gap:10px;}
  #brand .mark{width:22px;height:22px;border:2px solid var(--accent);border-radius:3px;position:relative;flex:none;}
  #brand .mark::after{content:"";position:absolute;inset:4px;border:2px solid var(--accent-2);border-radius:1px;}
  #brand .name{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em;}
  #brand .sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.08em;margin-left:8px;
    padding:2px 7px;border:1px solid var(--border);border-radius:20px;text-transform:uppercase;}
  #status{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}
  #status .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);}
  #status .dot.live{background:var(--success);box-shadow:0 0 8px var(--success);}

  /* ---------- Crew sidebar ---------- */
  #crew{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  #crew-head{padding:16px 16px 10px;border-bottom:1px solid var(--border);}
  #crew-head .eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;}
  #crew-head h1{font-family:var(--font-display);font-size:17px;margin:4px 0 2px;font-weight:700;}
  #crew-head p{margin:0;font-size:11.5px;color:var(--text-dim);line-height:1.4;}
  #crew-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;}
  #crew-list::-webkit-scrollbar{width:6px;}
  #crew-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  .worker-card{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px;display:flex;gap:10px;align-items:center;cursor:grab;transition:border-color .15s, transform .15s;}
  .worker-card:hover{border-color:var(--accent-dim);}
  .worker-card.dragging{opacity:.35;}
  .avatar{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--panel);border:1.5px solid var(--border);position:relative;}
  .avatar svg{width:19px;height:19px;fill:var(--text-dim);}
  .avatar .chan-dot{position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--panel-2);}
  .chan-dot.app{background:var(--app-color);}
  .chan-dot.whatsapp{background:var(--wa-color);}
  .w-info{flex:1;min-width:0;}
  .w-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .w-meta{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}
  .quick-add{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:transparent;
    color:var(--text-dim);font-size:15px;line-height:1;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
  .quick-add:hover{border-color:var(--accent);color:var(--accent);}
  #crew-empty{padding:20px 6px;color:var(--text-faint);font-size:12px;line-height:1.5;}
  #crew-foot{padding:12px 16px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}

  /* ---------- Building viewport ---------- */
  #stage{position:relative;overflow:hidden;background:
    radial-gradient(ellipse at 30% 20%, #101823 0%, var(--bg) 60%);}
  #canvas-holder{position:absolute;inset:0;}
  #canvas-holder canvas{display:block;}
  #stage.drag-over #canvas-holder{outline:2px dashed var(--accent-dim);outline-offset:-2px;}

  #stage-caption{position:absolute;top:16px;left:20px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
    letter-spacing:.06em;text-transform:uppercase;pointer-events:none;}
  #stage-caption b{color:var(--text-dim);}

  /* Elevator-style floor rail — signature element */
  #floor-rail{position:absolute;top:50%;right:22px;transform:translateY(-50%);display:flex;flex-direction:column-reverse;
    gap:6px;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:8px 6px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .rail-btn{width:40px;height:34px;border-radius:6px;border:1px solid var(--border);background:var(--panel);
    color:var(--text-dim);font-family:var(--font-mono);font-size:11px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all .12s;}
  .rail-btn:hover{border-color:var(--text-dim);color:var(--text);}
  .rail-btn.active{background:var(--accent);border-color:var(--accent);color:#191008;font-weight:700;
    box-shadow:0 0 14px rgba(255,106,31,.55);}
  #rail-add{width:40px;height:26px;border-radius:6px;border:1px dashed var(--border);background:transparent;
    color:var(--text-faint);cursor:pointer;font-size:14px;}
  #rail-add:hover{border-color:var(--accent-dim);color:var(--accent-dim);}

  #hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);
    font-size:10.5px;color:var(--text-faint);background:var(--panel-2);border:1px solid var(--border);
    padding:6px 14px;border-radius:20px;pointer-events:none;transition:opacity .2s;}

  /* ---------- Task modal ---------- */
  #overlay{position:fixed;inset:0;background:rgba(6,9,13,.6);backdrop-filter:blur(2px);display:none;
    align-items:center;justify-content:center;z-index:50;}
  #overlay.open{display:flex;}
  #modal{width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);}
  #modal-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
  #modal-head .avatar{width:38px;height:38px;}
  #modal-head .t1{font-family:var(--font-mono);font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;}
  #modal-head .t2{font-family:var(--font-display);font-weight:700;font-size:16px;}
  #modal-body{padding:18px 20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .field input[type=text], .field textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-family:var(--font-body);font-size:13.5px;padding:9px 11px;resize:vertical;}
  .field input[type=text]:focus, .field textarea:focus{outline:none;border-color:var(--accent-dim);}
  .field textarea{min-height:64px;}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .seg button{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;
    padding:9px 8px;font-family:var(--font-body);font-size:12px;cursor:pointer;text-align:left;line-height:1.3;}
  .seg button b{display:block;font-size:12.5px;color:var(--text);margin-bottom:1px;}
  .seg button.sel{border-color:var(--accent);background:rgba(255,106,31,.08);}
  .seg button.sel b{color:var(--accent);}

  #loc-readout{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:var(--panel-2);
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:8px;display:none;}
  #loc-readout.show{display:block;}
  #loc-readout b{color:var(--accent-2);}

  #modal-foot{padding:14px 20px 20px;display:flex;gap:10px;}
  .btn{flex:1;padding:11px;border-radius:8px;border:1px solid var(--border);font-family:var(--font-body);
    font-weight:600;font-size:13.5px;cursor:pointer;}
  .btn-ghost{background:transparent;color:var(--text-dim);}
  .btn-ghost:hover{color:var(--text);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#1a0f06;}
  .btn-primary:hover{background:#ff7d3d;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);
    border:1px solid var(--border);border-left:3px solid var(--success);padding:10px 16px;border-radius:8px;
    font-size:12.5px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="brand">
      <div class="mark"></div>
      <div class="name">BABYLON</div>
      <div class="sub">Site Console</div>
    </div>
    <div id="status"><span class="dot" id="status-dot"></span><span id="status-text">connecting…</span></div>
  </div>

  <div id="crew">
    <div id="crew-head">
      <div class="eyebrow">Roster</div>
      <h1>Crew</h1>
      <p>Drag a worker onto the building to pin their next task. Tap + for a task with no fixed location.</p>
    </div>
    <div id="crew-list"><div id="crew-empty">No workers registered yet.</div></div>
    <div id="crew-foot" id="crew-count">0 workers</div>
  </div>

  <div id="stage">
    <div id="canvas-holder"></div>
    <div id="stage-caption">Drag to orbit · Scroll to zoom · <b>Drop a worker on a floor to place a task</b></div>
    <div id="floor-rail"><button id="rail-add" title="Add floor">+</button></div>
    <div id="hint"></div>
  </div>
</div>

<div id="overlay">
  <div id="modal">
    <div id="modal-head">
      <div class="avatar" id="modal-avatar"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg></div>
      <div>
        <div class="t1">New task</div>
        <div class="t2" id="modal-worker-name">—</div>
      </div>
    </div>
    <div id="modal-body">
      <div class="field">
        <label>Title</label>
        <input type="text" id="f-title" placeholder="e.g. Pour footing along column line B" maxlength="120">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="f-desc" placeholder="What needs to happen, materials, safety notes…"></textarea>
      </div>
      <div class="field">
        <label>Location</label>
        <div class="seg" id="loc-seg">
          <button data-mode="none"><b>Not required</b>anywhere on site</button>
          <button data-mode="pin"><b>Pinpoint</b>shown on their map</button>
          <button data-mode="gps"><b>GPS live</b>tracked to the pin</button>
          <button data-mode="photo_checkin"><b>Photo check-in</b>you approve on arrival</button>
        </div>
        <div id="loc-readout"></div>
      </div>
      <div class="field" id="note-field" style="display:none;">
        <label>Spot description <span style="text-transform:none;color:var(--text-faint);">(optional, sent to worker)</span></label>
        <input type="text" id="f-note" placeholder="e.g. north stairwell, by the electrical panel" maxlength="140">
      </div>
    </div>
    <div id="modal-foot">
      <button class="btn btn-ghost" id="btn-cancel">Cancel</button>
      <button class="btn btn-primary" id="btn-create">Create task</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = ""; // same-origin
const PERSON_SVG = '<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>';

let workers = [];
let floors = JSON.parse(localStorage.getItem('babylon_floors') || 'null') || ["Ground","2","3","4","5"];
let selectedFloorIdx = 0;
let pendingPlacement = null; // {workerId, floorIdx, x, y}
let dragWorker = null;

// ---------------- Toast ----------------
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2600);
}

// ---------------- Crew list ----------------
function renderCrew(){
  const list = document.getElementById('crew-list');
  document.getElementById('crew-count').textContent = workers.length + (workers.length===1?' worker':' workers');
  if(!workers.length){
    list.innerHTML = '<div id="crew-empty">No workers registered yet.</div>';
    return;
  }
  list.innerHTML = '';
  workers.forEach(w=>{
    const card = document.createElement('div');
    card.className = 'worker-card';
    card.draggable = true;
    card.dataset.id = w.id;
    card.innerHTML = `
      <div class="avatar">${w.photo_url ? `<img src="${w.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : PERSON_SVG}
        <span class="chan-dot ${w.channel}"></span></div>
      <div class="w-info">
        <div class="w-name">${escapeHtml(w.name)}</div>
        <div class="w-meta">${w.language} · ${w.channel}</div>
      </div>
      <button class="quick-add" title="Assign task without a location">+</button>`;
    card.addEventListener('dragstart', e=>{
      dragWorker = w;
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', w.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
    card.querySelector('.quick-add').addEventListener('click', ()=>{
      pendingPlacement = null;
      openModal(w, 'none');
    });
    list.appendChild(card);
  });
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ---------------- Data loading ----------------
async function loadWorkers(){
  try{
    const r = await fetch(API + '/workers');
    workers = await r.json();
    renderCrew();
  }catch(e){ console.error(e); }
}
async function loadTasks(){
  try{
    const r = await fetch(API + '/tasks');
    const tasks = await r.json();
    tasks.filter(t=>t.location_mode!=='none' && t.floor).forEach(placePinFromTask);
  }catch(e){ console.error(e); }
}

// ---------------- WebSocket (live updates) ----------------
function connectWs(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/console`);
  ws.onopen = ()=> setStatus(true);
  ws.onclose = ()=> { setStatus(false); setTimeout(connectWs, 3000); };
  ws.onerror = ()=> ws.close();
  ws.onmessage = (evt)=>{
    const msg = JSON.parse(evt.data);
    if(msg.type === 'worker_registered'){ loadWorkers(); }
    if(msg.type === 'task_created'){ loadWorkers(); if(msg.floor) placePinFromTask(msg); toast('Task assigned'); }
    if(msg.type === 'task_updated'){ toast('Task status: ' + msg.status); }
    if(msg.type === 'checkin_submitted'){ toast('Check-in photo submitted — review needed'); }
  };
}
function setStatus(live){
  document.getElementById('status-dot').classList.toggle('live', live);
  document.getElementById('status-text').textContent = live ? 'live' : 'reconnecting…';
}

// ==================================================================
// 3D building
// ==================================================================
let scene, camera, renderer, raycaster, floorMeshes = [], pinGroup, ghostSprite;
let camYaw = 0.6, camPitch = 0.5, camDist = 34;
const FLOOR_H = 3.2, FLOOR_W = 14, FLOOR_D = 10;

function initScene(){
  const holder = document.getElementById('canvas-holder');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(42, holder.clientWidth/holder.clientHeight, 0.1, 400);
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(holder.clientWidth, holder.clientHeight);
  holder.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x8899aa, 1.1));
  const dl = new THREE.DirectionalLight(0xffffff, 0.9);
  dl.position.set(20, 30, 15);
  scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xff6a1f, 0.25);
  dl2.position.set(-15,10,-10);
  scene.add(dl2);

  pinGroup = new THREE.Group();
  scene.add(pinGroup);

  raycaster = new THREE.Raycaster();
  buildFloors();
  updateCamera();
  animate();

  const holderEl = document.getElementById('canvas-holder');
  holderEl.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('resize', onResize);
  document.getElementById('stage').addEventListener('wheel', onWheel, {passive:false});
}

function floorY(idx){ return idx * (FLOOR_H + 0.9); }

function buildFloors(){
  floorMeshes.forEach(f=>scene.remove(f.mesh));
  floorMeshes = [];
  floors.forEach((label, idx)=>{
    const y = floorY(idx);
    const geo = new THREE.BoxGeometry(FLOOR_W, 0.35, FLOOR_D);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x16212c, transparent:true, opacity:0.88, metalness:0.1, roughness:0.8
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, y, 0);
    mesh.userData.floorIdx = idx;
    scene.add(mesh);

    // blueprint grid overlay
    const grid = new THREE.GridHelper(Math.max(FLOOR_W,FLOOR_D), 10, 0x2a3f52, 0x1c2c3a);
    grid.position.set(0, y + 0.18, 0);
    grid.material.opacity = 0.5;
    grid.material.transparent = true;
    scene.add(grid);

    // support columns at corners (skip ground)
    if(idx > 0){
      [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
        const col = new THREE.Mesh(
          new THREE.BoxGeometry(0.22, FLOOR_H+0.9, 0.22),
          new THREE.MeshStandardMaterial({color:0x263748})
        );
        col.position.set(sx*(FLOOR_W/2-0.4), y-(FLOOR_H+0.9)/2, sz*(FLOOR_D/2-0.4));
        scene.add(col);
      });
    }

    floorMeshes.push({mesh, grid, idx, label});
  });
  buildRail();
}

function buildRail(){
  const rail = document.getElementById('floor-rail');
  rail.querySelectorAll('.rail-btn').forEach(b=>b.remove());
  floors.forEach((label, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'rail-btn';
    btn.textContent = label.length > 3 ? label.slice(0,3) : label;
    btn.title = 'Floor ' + label;
    btn.dataset.idx = idx;
    btn.addEventListener('click', ()=> focusFloor(idx));
    rail.insertBefore(btn, document.getElementById('rail-add'));
  });
  highlightRail(selectedFloorIdx);
}
document.getElementById('rail-add').addEventListener('click', ()=>{
  const n = prompt('Name this floor (e.g. "6" or "Roof")', String(floors.length));
  if(n===null || !n.trim()) return;
  floors.push(n.trim());
  localStorage.setItem('babylon_floors', JSON.stringify(floors));
  buildFloors();
});

function highlightRail(idx){
  document.querySelectorAll('.rail-btn').forEach(b=>{
    b.classList.toggle('active', Number(b.dataset.idx) === idx);
  });
}

function focusFloor(idx){
  selectedFloorIdx = idx;
  highlightRail(idx);
  targetPitch = 0.42;
  targetYaw = camYaw;
  targetLookY = floorY(idx);
  targetDist = 24;
}

let targetPitch = camPitch, targetYaw = camYaw, targetDist = camDist, targetLookY = floorY(2);
function updateCamera(){
  camYaw += (targetYaw - camYaw) * 0.08;
  camPitch += (targetPitch - camPitch) * 0.08;
  camDist += (targetDist - camDist) * 0.08;
  currentLookY += (targetLookY - currentLookY) * 0.08;
  const x = camDist * Math.sin(camYaw) * Math.cos(camPitch);
  const z = camDist * Math.cos(camYaw) * Math.cos(camPitch);
  const y = camDist * Math.sin(camPitch) + currentLookY;
  camera.position.set(x, y, z);
  camera.lookAt(0, currentLookY, 0);
}
let currentLookY = floorY(2);

function animate(){
  requestAnimationFrame(animate);
  updateCamera();
  renderer.render(scene, camera);
}
function onResize(){
  const holder = document.getElementById('canvas-holder');
  camera.aspect = holder.clientWidth/holder.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(holder.clientWidth, holder.clientHeight);
}

// ---- orbit drag (only when not dragging a worker card) ----
let orbiting = false, lastX=0, lastY=0;
function onPointerDown(e){
  if(dragWorker) return;
  orbiting = true; lastX = e.clientX; lastY = e.clientY;
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
}
function onPointerMove(e){
  if(!orbiting) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  targetYaw -= dx * 0.006;
  targetPitch = Math.max(0.15, Math.min(1.2, targetPitch + dy*0.005));
}
function onPointerUp(){ orbiting = false; window.removeEventListener('pointermove', onPointerMove); window.removeEventListener('pointerup', onPointerUp); }
function onWheel(e){ e.preventDefault(); targetDist = Math.max(12, Math.min(70, targetDist + e.deltaY*0.02)); }

// ---- HTML5 drag & drop of worker cards onto the canvas ----
const stageEl = document.getElementById('stage');
const holderEl = document.getElementById('canvas-holder');

holderEl.addEventListener('dragover', e=>{
  e.preventDefault();
  stageEl.classList.add('drag-over');
  const hit = raycastFromEvent(e);
  if(hit){
    highlightRail(hit.floorIdx);
    showGhost(hit);
    targetLookY = floorY(hit.floorIdx);
    targetPitch = 0.4;
    document.getElementById('hint').textContent = `Floor ${floors[hit.floorIdx]} · release to place`;
  } else {
    document.getElementById('hint').textContent = 'Move over a floor to place the task';
  }
});
holderEl.addEventListener('dragleave', ()=> stageEl.classList.remove('drag-over'));
holderEl.addEventListener('drop', e=>{
  e.preventDefault();
  stageEl.classList.remove('drag-over');
  clearGhost();
  document.getElementById('hint').textContent = '';
  const workerId = e.dataTransfer.getData('text/plain');
  const w = workers.find(w=>w.id===workerId);
  const hit = raycastFromEvent(e);
  if(!w || !hit) return;
  pendingPlacement = { floorIdx: hit.floorIdx, x: hit.nx, y: hit.nz };
  openModal(w, 'pin');
});

function raycastFromEvent(e){
  const rect = holderEl.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left)/rect.width)*2 - 1,
    -((e.clientY - rect.top)/rect.height)*2 + 1
  );
  raycaster.setFromCamera(mouse, camera);
  const meshes = floorMeshes.map(f=>f.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if(!hits.length) return null;
  const hit = hits[0];
  const idx = hit.object.userData.floorIdx;
  const local = hit.point;
  const nx = (local.x / (FLOOR_W/2) + 1) / 2;   // normalize 0..1
  const nz = (local.z / (FLOOR_D/2) + 1) / 2;
  return { floorIdx: idx, nx: Math.max(0,Math.min(1,nx)), nz: Math.max(0,Math.min(1,nz)), point: local };
}

function showGhost(hit){
  clearGhost();
  const geo = new THREE.RingGeometry(0.5, 0.65, 24);
  const mat = new THREE.MeshBasicMaterial({color:0xff6a1f, side:THREE.DoubleSide, transparent:true, opacity:0.9});
  ghostSprite = new THREE.Mesh(geo, mat);
  ghostSprite.rotation.x = -Math.PI/2;
  ghostSprite.position.set(hit.point.x, floorY(hit.floorIdx)+0.2, hit.point.z);
  scene.add(ghostSprite);
}
function clearGhost(){ if(ghostSprite){ scene.remove(ghostSprite); ghostSprite=null; } }

// ---- placed task pins ----
function makePinSprite(label, color){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const ctx = c.getContext('2d');
  ctx.beginPath(); ctx.arc(32,32,26,0,Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth=4; ctx.strokeStyle='#0b0f14'; ctx.stroke();
  ctx.fillStyle = '#0b0f14'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, 32, 34);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map:tex});
  const sp = new THREE.Sprite(mat);
  sp.scale.set(1.3,1.3,1.3);
  return sp;
}
function placePinFromTask(t){
  const idx = floors.indexOf(t.floor);
  if(idx === -1 || t.pin_x==null || t.pin_y==null) return;
  const w = workers.find(w=>w.id===t.worker_id);
  const initial = w ? w.name.charAt(0).toUpperCase() : '?';
  const color = t.location_mode === 'photo_checkin' ? '#ffc93c' : '#ff6a1f';
  const sprite = makePinSprite(initial, color);
  const x = (Number(t.pin_x)*2 - 1) * (FLOOR_W/2);
  const z = (Number(t.pin_y)*2 - 1) * (FLOOR_D/2);
  sprite.position.set(x, floorY(idx)+0.9, z);
  pinGroup.add(sprite);
}

// ==================================================================
// Task modal
// ==================================================================
let modalWorker = null, modalMode = 'none';
function openModal(worker, defaultMode){
  modalWorker = worker;
  modalMode = defaultMode;
  document.getElementById('modal-worker-name').textContent = worker.name;
  document.getElementById('modal-avatar').innerHTML = worker.photo_url
    ? `<img src="${worker.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
    : PERSON_SVG;
  document.getElementById('f-title').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-note').value = '';
  selectMode(defaultMode);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('f-title').focus();
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  modalWorker = null; pendingPlacement = null;
}
document.getElementById('btn-cancel').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

document.querySelectorAll('#loc-seg button').forEach(btn=>{
  btn.addEventListener('click', ()=> selectMode(btn.dataset.mode));
});
function selectMode(mode){
  if(mode !== 'none' && !pendingPlacement){
    toast('Drag this worker onto the building first to set a location');
    mode = 'none';
  }
  modalMode = mode;
  document.querySelectorAll('#loc-seg button').forEach(b=> b.classList.toggle('sel', b.dataset.mode===mode));
  const readout = document.getElementById('loc-readout');
  const noteField = document.getElementById('note-field');
  if(mode === 'none'){
    readout.classList.remove('show'); noteField.style.display = 'none';
  } else {
    readout.classList.add('show'); noteField.style.display = 'block';
    const floorLabel = floors[pendingPlacement.floorIdx];
    const modeText = {pin:'Pin shown on their map', gps:'Live GPS tracked to pin', photo_checkin:'Photo check-in required'}[mode];
    readout.innerHTML = `Floor <b>${floorLabel}</b> · ${modeText}`;
  }
}

document.getElementById('btn-create').addEventListener('click', async ()=>{
  const title = document.getElementById('f-title').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  if(!title || !desc){ toast('Title and description are required'); return; }
  const btn = document.getElementById('btn-create');
  btn.disabled = true; btn.textContent = 'Creating…';

  const fd = new FormData();
  fd.append('worker_id', modalWorker.id);
  fd.append('title', title);
  fd.append('description', desc);
  fd.append('location_mode', modalMode);
  if(modalMode !== 'none' && pendingPlacement){
    fd.append('floor', floors[pendingPlacement.floorIdx]);
    fd.append('pin_x', pendingPlacement.x.toFixed(4));
    fd.append('pin_y', pendingPlacement.y.toFixed(4));
    const note = document.getElementById('f-note').value.trim();
    if(note) fd.append('location_note', note);
  }
  try{
    const r = await fetch(API + '/tasks', {method:'POST', body:fd});
    if(!r.ok) throw new Error(await r.text());
    toast('Task created for ' + modalWorker.name);
    closeModal();
    loadTasks();
  }catch(e){
    toast('Failed to create task');
    console.error(e);
  }finally{
    btn.disabled = false; btn.textContent = 'Create task';
  }
});

// ---------------- boot ----------------
initScene();
loadWorkers();
loadTasks();
connectWs();
setInterval(loadWorkers, 15000);
</script>
